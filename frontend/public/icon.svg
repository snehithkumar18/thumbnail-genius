<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#B180FF" />
      <stop offset="60%" stop-color="#8B47FF" />
      <stop offset="100%" stop-color="#551FBA" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with slight rounding for squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="4" opacity="0.15" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="2" opacity="0.1" />

  <!-- Play Button / Target icon in center -->
  <path d="M190 160 C190 140, 205 130, 225 140 L345 230 C365 240, 365 260, 345 270 L225 360 C205 370, 190 360, 190 340 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- AI Sparkle elements -->
  <path d="M370 120 C370 140 380 150 400 150 C380 150 370 160 370 180 C370 160 360 150 340 150 C360 150 370 140 370 120 Z" fill="#FFE97F" />
  <path d="M120 340 C120 350 125 355 135 355 C125 355 120 360 120 370 C120 360 115 355 105 355 C115 355 120 350 120 340 Z" fill="#FFE97F" opacity="0.8" />
</svg>
